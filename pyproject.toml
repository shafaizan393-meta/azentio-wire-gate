[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wire-summary"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn>=0.27,<1",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27,<1",
    "pytest>=8,<9",
]
load = [
    "kafka-python>=2.0.2,<3",
]

[tool.pytest.ini_options]
testpaths = ["python_tests"]
pythonpath = ["."]
